name: Dispatch Update

on:
  push:
    paths:
      - 'README.md'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger target repository workflow
        run: |
          curl -X POST \
          -H "Accept: application/vnd.github.everest-preview+json" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/CarlosValladaresDiaz/any-helm-terraform-ek8-installer-2/dispatches \
          -d '{"event_type":"file_updated","client_payload":{"file":"README.md"}}'
